<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SIGA-Comunitario • Redirigiendo...</title>
</head>
<body>
  <script type="module">
    import { getCurrentUser } from './auth.js';
    const user = getCurrentUser();
    if (!user) {
      window.location.href = 'login.html';
    } else if (user.rol === 'LECTOR') {
      window.location.href = 'lecturas.html';
    } else {
      window.location.href = 'socios.html';
    }
  </script>
</body>
</html>
