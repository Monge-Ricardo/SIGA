<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión • SIGA-Comunitario</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 1.5rem;
    }
    .login-wrapper {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-icon {
      font-size: 2.75rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .quick-roles-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .quick-roles-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      text-align: center;
    }
    .roles-buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn-role {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .btn-role:hover {
      border-color: #0284c7;
      background: #f0f9ff;
      transform: translateY(-1px);
    }
    .role-badge-pill {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-weight: 700;
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 0.78rem;
      margin: 1.25rem 0;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider-text span {
      padding: 0 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-icon">💧</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">
        SIGA-Comunitario
      </h1>
      <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.25rem;">
        Sistema de Gestión de Agua Potable y Control de Caja
      </p>
    </div>

    <!-- Acceso Rápido por Rol -->
    <div class="quick-roles-card">
      <div class="quick-roles-title">⚡ Acceso Rápido por Rol (1-Click)</div>
      <div class="roles-buttons-grid">
        <button class="btn-role" id="btnRoleAdmin">
          <div>
            <div>👑 <strong>Administrador General</strong></div>
            <div style="font-size: 0.75rem; color: #64748b; font-weight: 400;">Control total, reportes y cierres</div>
          </div>
          <span class="role-badge-pill" style="background: #e0e7ff; color: #4338ca;">ADMIN</span>
        </button>

        <button class="btn-role" id="btnRoleTesorero">
          <div>
            <div>💵 <strong>Tesorera / Cajera</strong></div>
            <div style="font-size: 0.75rem; color: #64748b; font-weight: 400;">Cobros, socios, caja y fondos</div>
          </div>
          <span class="role-badge-pill" style="background: #dcfce7; color: #15803d;">CAJERO</span>
        </button>

        <button class="btn-role" id="btnRoleLector">
          <div>
            <div>⏱️ <strong>Lector de Medidores</strong></div>
            <div style="font-size: 0.75rem; color: #64748b; font-weight: 400;">Toma de lecturas de campo por sector</div>
          </div>
          <span class="role-badge-pill" style="background: #fef3c7; color: #b45309;">LECTOR</span>
        </button>
      </div>
    </div>

    <div class="divider-text">
      <span>O inicia sesión manualmente</span>
    </div>

    <form id="formLogin" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label for="loginEmail">Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="ej. admin@agua.com" required />
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>

      <div id="loginError" style="color: #dc2626; font-size: 0.82rem; display: none;"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
        🔐 Entrar al Sistema
      </button>
    </form>
  </div>

  <script type="module">
    import { login, loginAsRole, getCurrentUser } from './auth.js';

    // Si ya está logueado, redirigir
    const user = getCurrentUser();
    if (user) {
      if (user.rol === 'LECTOR') {
        window.location.href = 'lecturas.html';
      } else {
        window.location.href = 'socios.html';
      }
    }

    const showError = (msg) => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = `⚠️ ${msg}`;
      errEl.style.display = 'block';
    };

    document.getElementById('btnRoleAdmin').addEventListener('click', () => {
      loginAsRole('ADMIN');
      window.location.href = 'socios.html';
    });

    document.getElementById('btnRoleTesorero').addEventListener('click', () => {
      loginAsRole('CAJERO');
      window.location.href = 'socios.html';
    });

    document.getElementById('btnRoleLector').addEventListener('click', () => {
      loginAsRole('LECTOR');
      window.location.href = 'lecturas.html';
    });

    document.getElementById('formLogin').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        const u = login(email, pass);
        if (u.rol === 'LECTOR') {
          window.location.href = 'lecturas.html';
        } else {
          window.location.href = 'socios.html';
        }
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
