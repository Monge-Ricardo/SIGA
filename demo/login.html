<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión • SIGA-Comunitario</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-icon {
      font-size: 2.75rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .creds-reference-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.9rem;
      margin-top: 1.5rem;
      font-size: 0.82rem;
    }
    .creds-reference-title {
      font-weight: 700;
      color: #475569;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .cred-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .cred-item:last-child {
      border-bottom: none;
    }
    .badge-role-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-icon">💧</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; margin: 0;">
        SIGA-Comunitario
      </h1>
      <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.35rem;">
        Gestión de Agua Potable, Facturación y Control de Fondos
      </p>
    </div>

    <form id="formLogin" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label for="loginUser" style="font-weight: 600; font-size: 0.875rem; color: #334155;">Usuario o Correo Electrónico</label>
        <input 
          type="text" 
          id="loginUser" 
          placeholder="ej: cajero o admin" 
          required 
          autocomplete="username"
          style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;" 
        />
      </div>

      <div class="form-group">
        <label for="loginPassword" style="font-weight: 600; font-size: 0.875rem; color: #334155;">Contraseña</label>
        <input 
          type="password" 
          id="loginPassword" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
          style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;" 
        />
      </div>

      <div id="loginError" style="color: #dc2626; font-size: 0.85rem; display: none; background: #fef2f2; padding: 0.5rem; border-radius: 6px; border: 1px solid #fecaca;"></div>

      <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700; border-radius: 6px; background: #0284c7; color: white; border: none; cursor: pointer; margin-top: 0.5rem;">
        🔐 Iniciar Sesión
      </button>
    </form>

    <!-- Tarjeta de Referencia de Usuarios del Sistema -->
    <div class="creds-reference-card">
      <div class="creds-reference-title">
        <span>👥</span> Usuarios y Roles Registrados:
      </div>
      
      <div class="cred-item">
        <div>
          <strong>cajero</strong> / <code>Cajero123*</code>
          <div style="font-size: 0.75rem; color: #64748b;">Tesorero / Operador Integral</div>
        </div>
        <span class="badge-role-tag" style="background: #dcfce7; color: #15803d;">CAJERO</span>
      </div>

      <div class="cred-item">
        <div>
          <strong>admin</strong> / <code>Admin123*</code>
          <div style="font-size: 0.75rem; color: #64748b;">Gobernanza / Tarifas</div>
        </div>
        <span class="badge-role-tag" style="background: #e0e7ff; color: #4338ca;">ADMIN</span>
      </div>

      <div class="cred-item">
        <div>
          <strong>lector</strong> / <code>Lector123*</code>
          <div style="font-size: 0.75rem; color: #64748b;">Operador de Micromedición</div>
        </div>
        <span class="badge-role-tag" style="background: #fef3c7; color: #b45309;">LECTOR</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from './auth.js';

    const showError = (msg) => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = `⚠️ ${msg}`;
      errEl.style.display = 'block';
    };

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const u = await login(identifier, pass);
        if (u.rol === 'LECTOR') {
          window.location.href = 'lecturas.html';
        } else {
          window.location.href = 'socios.html';
        }
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = '🔐 Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
