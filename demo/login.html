<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión • SIGA-Comunitario</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .logo {
      font-size: 2.75rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }
    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 0.5rem;
      letter-spacing: -0.025em;
    }
    .login-header p {
      font-size: 0.88rem;
      color: #64748b;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .form-control-input {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.15s;
    }
    .form-control-input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .quick-roles {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    .quick-roles-title {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .quick-btns-row {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-quick-role {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-quick-role:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-header">
      <div class="logo">💧</div>
      <h1>SIGA-Comunitario</h1>
      <p>Sistema Integral de Agua Potable y Facturación</p>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="loginUser">Usuario o Correo</label>
        <input 
          type="text" 
          id="loginUser" 
          class="form-control-input" 
          placeholder="ej: cajero, admin o lector" 
          required 
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input 
          type="password" 
          id="loginPassword" 
          class="form-control-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <div id="loginError" class="error-box"></div>

      <button 
        type="submit" 
        id="btnSubmit" 
        class="btn btn-primary" 
        style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700; border-radius: 6px; background: #0284c7; border: none; color: white; cursor: pointer;"
      >
        Iniciar Sesión
      </button>

      <!-- Selector Rápido de Roles para Pruebas -->
      <div class="quick-roles">
        <div class="quick-roles-title">Cuentas de Acceso Rápido:</div>
        <div class="quick-btns-row">
          <button type="button" class="btn-quick-role" data-user="cajero" data-pass="Cajero123*">💵 Tesorero (Cajero)</button>
          <button type="button" class="btn-quick-role" data-user="admin" data-pass="Admin123*">👑 Administrador</button>
          <button type="button" class="btn-quick-role" data-user="lector" data-pass="Lector123*">⏱️ Lector de Campo</button>
        </div>
      </div>
    </form>
  </div>

  <script type="module">
    import { login } from './auth.js';

    // Registrar Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.warn);
    }

    const showError = (msg) => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = `⚠️ ${msg}`;
      errEl.style.display = 'block';
    };

    // Botones de acceso rápido
    document.querySelectorAll('.btn-quick-role').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('loginUser').value = btn.getAttribute('data-user');
        document.getElementById('loginPassword').value = btn.getAttribute('data-pass');
        document.getElementById('formLogin').dispatchEvent(new Event('submit'));
      });
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      document.getElementById('loginError').style.display = 'none';

      try {
        const u = await login(identifier, pass);
        if (u.rol === 'LECTOR') {
          window.location.href = 'lecturas.html';
        } else if (u.rol === 'CAJERO') {
          window.location.href = 'caja.html';
        } else {
          window.location.href = 'socios.html';
        }
      } catch (err) {
        showError(err.message || 'Credenciales incorrectas.');
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
