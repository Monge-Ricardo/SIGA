<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión • SIGA-Comunitario</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-icon {
      font-size: 2.75rem;
      display: inline-block;
      margin-bottom: 0.25rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.875rem;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .form-control-input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control-input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .error-box {
      color: #dc2626;
      font-size: 0.85rem;
      background: #fef2f2;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #fecaca;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-icon">💧</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; margin: 0;">
        SIGA-Comunitario
      </h1>
      <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.35rem;">
        Gestión de Agua Potable y Control de Fondos
      </p>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="loginUser">Usuario o Correo Electrónico</label>
        <input 
          type="text" 
          id="loginUser" 
          class="form-control-input" 
          placeholder="ej: cajero, admin o lector" 
          required 
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input 
          type="password" 
          id="loginPassword" 
          class="form-control-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <div id="loginError" class="error-box"></div>

      <button 
        type="submit" 
        id="btnSubmit" 
        class="btn btn-primary" 
        style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700; border-radius: 6px; background: #0284c7; border: none; color: white; cursor: pointer;"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>

  <script type="module">
    import { login } from './auth.js';

    const showError = (msg) => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = `⚠️ ${msg}`;
      errEl.style.display = 'block';
    };

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      document.getElementById('loginError').style.display = 'none';

      try {
        const u = await login(identifier, pass);
        if (u.rol === 'LECTOR') {
          window.location.href = 'lecturas.html';
        } else {
          window.location.href = 'socios.html';
        }
      } catch (err) {
        showError(err.message || 'Credenciales incorrectas.');
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
